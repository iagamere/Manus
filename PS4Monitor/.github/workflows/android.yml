name: Android verification

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
      - name: Run unit tests and lint
        run: gradle testDebugUnitTest lintDebug --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify APK and reports
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ci-artifacts/PS4Monitor-debug.apk
          find app/build/test-results app/build/reports -type f 2>/dev/null | tar -czf ci-artifacts/diagnostics.tar.gz -T - || true
      - uses: actions/upload-artifact@v4
        with:
          name: PS4Monitor-debug
          path: ci-artifacts/PS4Monitor-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PS4Monitor-diagnostics
          path: ci-artifacts/diagnostics.tar.gz
